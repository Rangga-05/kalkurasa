<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALKURASA - Video Demo (Dewi)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#12100E; --cream:#FFF9F0; --gold:#FDE047; --accent:#C2410C; --lime:#D9F99D; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#1d1a17; overflow:hidden; font-family:"Plus Jakarta Sans",system-ui,sans-serif; }

  #stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; overflow:hidden;
    transform-origin:center center; background:var(--cream); }

  /* ---------- Adegan Dewi ---------- */
  #scene { position:absolute; inset:0; width:100%; height:100%; display:block; transition:filter .8s ease; }
  #scene.dim { filter:brightness(.52) blur(2px); }
  /* animasi karakter (ilustrasi vektor) */
  #scene .breathe { animation:breathe 3.6s ease-in-out infinite; }
  #scene #head { transform-origin:480px 640px; animation:headsway 6s ease-in-out infinite; }
  #scene .blink { transform-origin:482px 458px; animation:blink 4.4s infinite; }
  #scene .tap1, #scene .tap2 { transform-box:fill-box; transform-origin:center; }
  #scene.typing .tap1 { animation:tap .28s ease-in-out infinite; }
  #scene.typing .tap2 { animation:tap .4s ease-in-out infinite .1s; }
  #scene .steam { animation:steam 3s ease-in-out infinite; }
  #scene .sway { transform-origin:1690px 700px; animation:sway 5s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @keyframes headsway { 0%,100%{transform:rotate(-1.6deg)} 50%{transform:rotate(1.8deg)} }
  @keyframes blink { 0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.08)} }
  @keyframes tap { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  @keyframes steam { 0%,100%{transform:translateY(0);opacity:.45} 50%{transform:translateY(-12px);opacity:.15} }
  @keyframes sway { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)} }
  #lower { position:absolute; right:90px; top:90px; background:#FFFDF9; border:4px solid var(--ink); border-radius:22px;
    box-shadow:8px 8px 0 var(--ink); padding:16px 30px; transform:translateX(160%); transition:transform .7s cubic-bezier(.16,1,.3,1); z-index:15; }
  #lower.show { transform:none; }
  #lower b { display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:44px; color:var(--ink); }
  #lower span { font-weight:700; font-size:24px; color:#5C5046; }

  /* ---------- Jendela laptop (popup) ---------- */
  #popup { position:absolute; left:0; top:0; width:1500px; height:900px; transform-origin:0 0; opacity:0; pointer-events:none;
    border:5px solid var(--ink); border-radius:24px; background:#fff; overflow:hidden; box-shadow:14px 14px 0 var(--ink);
    transition:transform .9s cubic-bezier(.65,0,.35,1), opacity .4s; z-index:20; }
  #popup.open { opacity:1; }
  #chrome { height:48px; background:#F7EFE2; border-bottom:4px solid var(--ink); display:flex; align-items:center; gap:10px; padding:0 18px; }
  #chrome i { width:14px; height:14px; border-radius:50%; border:2px solid var(--ink); display:block; }
  #chrome i:nth-child(1){background:#fb7185} #chrome i:nth-child(2){background:#FDE047} #chrome i:nth-child(3){background:#84cc16}
  #url { margin-left:14px; flex:1; max-width:760px; height:32px; background:#fff; border:2px solid var(--ink); border-radius:999px;
    font:700 14px/28px "Plus Jakarta Sans"; padding:0 16px; color:#3d352e; white-space:nowrap; overflow:hidden; }
  #frame { display:block; width:1490px; height:842px; border:0; background:#fff; }

  /* ---------- Kursor ---------- */
  #cursor { position:absolute; left:0; top:0; width:34px; height:34px; z-index:35; pointer-events:none; opacity:0;
    transition:transform .85s cubic-bezier(.45,0,.2,1), opacity .3s; filter:drop-shadow(2px 3px 0 rgba(0,0,0,.35)); }
  #ripple { position:absolute; width:60px; height:60px; margin:-30px 0 0 -30px; border:5px solid var(--accent); border-radius:50%;
    z-index:34; pointer-events:none; opacity:0; }
  #ripple.go { animation:rip .55s ease-out; }
  @keyframes rip { 0%{opacity:1;transform:scale(.3)} 100%{opacity:0;transform:scale(1.5)} }

  /* ---------- Teks bantuan VO (Subtitle) ---------- */
  #vo { position:absolute; left:50%; bottom:28px; transform:translateX(-50%); max-width:1560px; text-align:center;
    background:rgba(18,16,14,.92); color:#FFFDF9; font-weight:700; font-size:26px; line-height:1.45; padding:14px 34px; border-radius:18px;
    border:2px solid rgba(255,255,255,.2); box-shadow:0 8px 24px rgba(0,0,0,.3);
    opacity:0; transition:opacity .35s; z-index:50; pointer-events:none; }
  #vo.show { opacity:1; }
  body.novo #vo { display:none !important; }

  /* ---------- Toolbar Atas ---------- */
  #topBar { position:absolute; top:20px; right:30px; display:flex; align-items:center; gap:10px; z-index:60; }
  #topBar button { font:700 14px "Plus Jakarta Sans",sans-serif; padding:9px 18px; border:2.5px solid var(--ink); background:#FFFDF9;
    border-radius:999px; box-shadow:3px 3px 0 var(--ink); cursor:pointer; transition:all .15s; }
  #topBar button:hover { background:var(--gold); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); }
  #topBar button.on { background:var(--lime); }

  /* ---------- Judul & Hitung Mundur ---------- */
  #title { position:absolute; inset:0; display:grid; place-items:center; background:var(--cream); z-index:70; text-align:center; transition:opacity .6s; }
  #title.hide { opacity:0; pointer-events:none; }
  #title h1 { font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:96px; letter-spacing:-2px; color:var(--ink); }
  #title p { font-weight:700; font-size:30px; color:#5C5046; margin-top:10px; }
  #title button { margin-top:36px; font:800 28px "Plus Jakarta Sans"; padding:16px 48px; border:4px solid var(--ink); border-radius:999px;
    background:var(--gold); box-shadow:6px 6px 0 var(--ink); cursor:pointer; transition:transform .15s; }
  #title button:hover { transform:scale(1.04); background:#facc15; }
  #title small { display:block; margin-top:22px; font-weight:600; font-size:18px; color:#7a6c60; }

  #count { position:absolute; inset:0; display:none; place-items:center; z-index:80; font:800 320px "Bricolage Grotesque"; color:var(--ink); background:rgba(255,249,240,.88); }
</style>
</head>
<body>
<div id="stage">
  <!-- Karakter Vektor Dewi di Ruang Kerja -->
  <svg id="scene" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-label="Ilustrasi Dewi di depan laptop">
    <defs>
      <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1.6" fill="#12100E" opacity=".11"/></pattern>
    </defs>

    <rect width="1920" height="1080" fill="url(#dots)"/>
    <g stroke="#12100E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <!-- jendela -->
      <rect x="1380" y="110" width="360" height="310" rx="18" fill="#DDF1F7"/>

        <!-- lengan -->

        <path d="M625 655Q705 745 775 738" fill="none" stroke="#FFF3DC" stroke-width="68"/>

        <path d="M300 860V700Q300 600 400 582H560Q660 600 660 700V860Z" fill="#FFF3DC"/>
        <path d="M440 585Q480 628 520 585" fill="none"/>

        <!-- kepala -->
        <g id="head">
          <circle cx="480" cy="440" r="132" fill="#D2693A"/>
          <path d="M350 450Q326 600 368 656Q480 700 592 656Q634 600 610 450Z" fill="#D2693A"/>
          <path d="M392 640Q480 676 568 640" fill="none" stroke="#B4532A" stroke-width="5"/>
          <ellipse cx="480" cy="456" rx="86" ry="98" fill="#E9B48C"/>
          <path d="M392 422Q480 336 568 422Q540 380 480 374Q420 380 392 422Z" fill="#D2693A"/>
          <path d="M424 426Q444 415 464 424M500 424Q520 415 540 426" fill="none"/>
          <g class="blink" stroke="none">
            <ellipse cx="446" cy="458" rx="9" ry="12" fill="#12100E"/>
            <ellipse cx="518" cy="458" rx="9" ry="12" fill="#12100E"/>
            <circle cx="449" cy="453" r="3" fill="#fff"/><circle cx="521" cy="453" r="3" fill="#fff"/>
          </g>
          <path d="M482 468Q476 486 488 487" fill="none" stroke-width="4"/>
          <path d="M448 506Q482 534 516 506" fill="none"/>
          <ellipse cx="418" cy="494" rx="16" ry="10" fill="#F08A6B" opacity=".55" stroke="none"/>
          <ellipse cx="548" cy="494" rx="16" ry="10" fill="#F08A6B" opacity=".55" stroke="none"/>
        </g>
      </g>

      <!-- meja -->
      <rect x="-10" y="760" width="1940" height="340" fill="#E6BE86"/>
      <rect x="-10" y="760" width="1940" height="42" fill="#C99A5E"/>
      <path d="M0 880H1920M0 960H1920" stroke="#C99A5E" stroke-width="4" opacity=".6" fill="none"/>

      <!-- laptop -->
      <rect x="740" y="290" width="640" height="410" rx="24" fill="#2A2522"/>
      <rect x="760" y="320" width="600" height="360" rx="8" fill="#F7EFE2" stroke-width="0"/>
      <text x="1060" y="512" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="46" fill="#12100E" stroke="none">KALKURASA</text>
      <circle cx="1060" cy="304" r="5" fill="#6b625a" stroke="none"/>

      <!-- tangan mengetik -->
      <g id="hands">
        <ellipse class="tap1" cx="802" cy="744" rx="34" ry="21" fill="#E9B48C"/>

      </g>

      <!-- mug + uap -->
      <rect x="1500" y="680" width="94" height="86" rx="16" fill="#FFFDF9"/>

      <g class="steam" fill="none" stroke="#12100E" stroke-width="5" opacity=".45">
        <path d="M1530 660Q1516 640 1532 622Q1546 604 1530 586"/>
        <path d="M1564 660Q1550 640 1566 622Q1580 604 1564 586"/>

      <!-- tanaman -->
      <g class="sway">
        <path d="M1680 700Q1650 640 1620 610Q1680 620 1692 692Z" fill="#84CC16"/>
        <path d="M1696 700Q1708 630 1752 590Q1752 660 1710 700Z" fill="#65A30D"/>
        <path d="M1690 700Q1690 620 1690 560Q1722 620 1700 700Z" fill="#84CC16"/>
      </g>
      <path d="M1640 700H1760L1744 772H1656Z" fill="#C2410C"/>
    </g>
  </svg>

  <div id="lower"><b>Dewi Lestari</b><span>Koordinator Acara Kantor</span></div>

  <!-- Pop-up Layar Laptop -->
  <div id="popup">
    <div id="chrome"><i></i><i></i><i></i><div id="url">kalkurasa-rouge.vercel.app</div></div>
    <iframe id="frame" title="KALKURASA Live Demo"></iframe>
  </div>

  <div id="ripple"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.7-7.8L21 10.5z" fill="#12100E" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <div id="vo"></div>

  <!-- Floating Toolbar -->
  <div id="topBar">
    <button id="audioBtn" class="on">🔊 Audio VO: Aktif (V)</button>
    <button id="subBtn" class="on">💬 Subtitle (H)</button>
    <button id="restartBtn">↺ Ulang (R)</button>
  </div>

  <div id="title">
    <div>
      <h1>KALKURASA</h1>
      <p>Video Demo · Sisi Pelanggan (Dewi Lestari)</p>
      <button id="startBtn">▶ Mulai Demo (Spasi)</button>
      <small>Mulai dari Beranda (Homepage) · Login · Pemesanan Otomatis · Audio VO Suara Asli</small>
    </div>
  </div>
  <div id="count"></div>
</div>

<script>
/* ============ KONFIGURASI ============ */
const q = new URLSearchParams(location.search);
const SCREEN = { x:+(q.get("sx")||760), y:+(q.get("sy")||320), w:+(q.get("sw")||600), h:+(q.get("sh")||360) };
const FINAL = { x:210, y:90 };            // posisi popup saat membesar
const POPUP_W = 1500, CHROME_H = 48+4;    // lebar popup & tinggi chrome (px)
const CUSTOMER = { email:"customer@demo.test", password:"demo12345", name:"Dewi Lestari", contact:"081234567890" };

/* ============ UTIL & STATE ============ */
const $ = (s)=>document.querySelector(s);
const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));
const stage=$("#stage"), popup=$("#popup"), frame=$("#frame"), cursor=$("#cursor"), ripple=$("#ripple");
let run = 0;
let audioVoiceActive = true;
let subtitleActive = true;
const alive = (id)=>{ if(id!==run) throw new Error("cancel"); };

function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",fit); fit();

const doc = ()=>frame.contentDocument;
const win = ()=>frame.contentWindow;

/* ============ AUDIO VOICE OVER (TTS ID) ============ */
function initVoices() {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.getVoices();
}
initVoices();
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = initVoices;
}

function speakVoice(text) {
  if (!audioVoiceActive || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = "id-ID";
    utt.rate = 1.0;
    utt.pitch = 1.06;
    const voices = window.speechSynthesis.getVoices();
    const idVoice = voices.find(v => v.lang === "id-ID" || v.lang.startsWith("id") || v.name.toLowerCase().includes("indonesia") || v.name.toLowerCase().includes("damayanti"));
    if (idVoice) utt.voice = idVoice;
    window.speechSynthesis.speak(utt);
  } catch (err) {
    console.warn("TTS error:", err);
  }
}

async function waitFor(fn, timeout=35000){
  const t0=Date.now();
  while(Date.now()-t0<timeout){ try{ const v=fn(); if(v) return v; }catch(e){} await sleep(150); }
  throw new Error("Timeout menunggu elemen/kondisi");
}
const byText = (sel,text)=>[...doc().querySelectorAll(sel)].find(e=>e.textContent.replace(/\s+/g," ").toLowerCase().includes(text.toLowerCase()));

// Posisi elemen di dalam iframe -> koordinat panggung
function stagePos(el){
  const r = el.getBoundingClientRect();
  return { x: FINAL.x + 5 + r.left + r.width/2, y: FINAL.y + 5 + CHROME_H + r.top + r.height/2 };
}
async function inView(el){
  if (!el) return;
  const r=el.getBoundingClientRect(), h=win().innerHeight;
  if(r.top<80 || r.bottom>h-80){ el.scrollIntoView({behavior:"smooth",block:"center"}); await sleep(750); }
}
async function moveTo(el){
  await inView(el);
  const p=stagePos(el);
  cursor.style.opacity=1;
  cursor.style.transform=`translate(${p.x-6}px,${p.y-4}px)`;
  await sleep(850);
  return p;
}
async function click(el){
  const p=await moveTo(el);
  ripple.style.left=p.x+"px"; ripple.style.top=p.y+"px";
  ripple.classList.remove("go"); void ripple.offsetWidth; ripple.classList.add("go");
  await sleep(180);
  el.click();
  await sleep(500);
}

// React 18 & 19 Value Tracker Support
function setNative(el, value){
  const proto = el.tagName==="SELECT"?win().HTMLSelectElement.prototype : el.tagName==="TEXTAREA"?win().HTMLTextAreaElement.prototype : win().HTMLInputElement.prototype;
  const desc = Object.getOwnPropertyDescriptor(proto,"value");
  if(desc && desc.set){ desc.set.call(el,value); } else { el.value = value; }
  if(el._valueTracker){ el._valueTracker.setValue(""); }
}

async function type(el, text, delay=65){
  await moveTo(el); el.focus();
  $("#scene").classList.add("typing");
  setNative(el,""); el.dispatchEvent(new (win().Event)("input",{bubbles:true}));
  for(const ch of text){
    setNative(el, el.value+ch);
    el.dispatchEvent(new (win().Event)("input",{bubbles:true}));
    await sleep(delay);
  }
  el.dispatchEvent(new (win().Event)("change",{bubbles:true}));
  $("#scene").classList.remove("typing");
  await sleep(400);
}

async function choose(el, value){
  await moveTo(el);
  setNative(el,value);
  el.dispatchEvent(new (win().Event)("input",{bubbles:true}));
  el.dispatchEvent(new (win().Event)("change",{bubbles:true}));
  await sleep(650);
}

async function goto(path){
  frame.src = path;
  await new Promise(r=>{ frame.onload=()=>r(); });
  await sleep(1100);
  $("#url").textContent = "kalkurasa-rouge.vercel.app" + (path==="/"?"":path);
}

async function say(text, ms){
  if(subtitleActive){
    $("#vo").textContent = text;
    $("#vo").classList.add("show");
  }
  speakVoice(text);
  if(ms) await sleep(ms);
}
const hush = ()=>{ $("#vo").classList.remove("show"); };

async function openPopup(){
  const s = SCREEN.w/POPUP_W;
  popup.style.transition="none";
  popup.style.transform=`translate(${SCREEN.x}px,${SCREEN.y}px) scale(${s})`;
  void popup.offsetWidth; popup.style.transition="";
  popup.classList.add("open");
  $("#scene").classList.add("dim");
  await sleep(50);
  popup.style.transform=`translate(${FINAL.x}px,${FINAL.y}px) scale(1)`;
  await sleep(950);
}
async function closePopup(){
  const s = SCREEN.w/POPUP_W;
  cursor.style.opacity=0;
  popup.style.transform=`translate(${SCREEN.x}px,${SCREEN.y}px) scale(${s})`;
  $("#scene").classList.remove("dim");
  await sleep(850);
  popup.classList.remove("open");
}

/* ============ SKENARIO DEMO RESMI ============ */
async function scenario(id){
  const A=()=>alive(id);

  // BAB 1. Perkenalan Dewi
  $("#lower").classList.add("show");
  await say("Halo! Ini Dewi Lestari, koordinator acara kantor. Hari ini Dewi bertugas memesan paket konsumsi untuk rapat dan seminar perusahaannya.", 6000); A();
  hush();

  // BAB 2. Buka Laptop -> Beranda (Homepage)
  await say("Dewi membuka laptop dan mengakses website resmi Kalkurasa.", 2500); A();
  await openPopup(); A();
  await goto("/"); A();

  // Eksplorasi Homepage
  await say("Di beranda, Dewi melihat katalog menu dan bagaimana dapur beroperasi dengan mesin keputusan cerdas.", 5000); A();
  win().scrollTo({top: 480, behavior:"smooth"});
  await sleep(2200); A();
  win().scrollTo({top: 0, behavior:"smooth"});
  await sleep(1100); A();

  // BAB 3. Masuk / Login Akun Pelanggan
  await say("Untuk mulai memesan, Dewi mengklik tombol Masuk di navigasi.", 3000); A();
  const navLogin = doc().querySelector("a[href*='/login']") || byText("a", "Masuk");
  if (navLogin) {
    await click(navLogin); A();
    await sleep(1400);
  } else {
    await goto("/login?reauth=1"); A();
  }

  // Isi Formulir Login
  const email = await waitFor(()=>doc().querySelector("#email")); A();
  await say("Dewi memasukkan email dan kata sandi akun pelanggan.", 2500);
  await type(email, CUSTOMER.email, 55); A();
  await type(doc().querySelector("#password"), CUSTOMER.password, 75); A();
  const submitLogin = doc().querySelector("form button[type=submit]");
  await click(submitLogin); A();
  
  // Tunggu redirect selesai
  await waitFor(()=>win().location.pathname!=="/login", 25000); A();
  await sleep(1200);

  // Pastikan berada di halaman /pesan
  if(win().location.pathname!=="/pesan"){
    await goto("/pesan"); A();
  }
  await waitFor(()=>doc().querySelector("select[name^='items']")); A();
  await sleep(1200);

  // BAB 4. Langkah 1: Pilih Menu & Jumlah Porsi (Aman kapasitas: 35 porsi)
  await say("Langkah pertama: Dewi memilih menu Nasi Box Ayam Spesial sebanyak 35 porsi.", 4500); A();
  const sel = doc().querySelector("select[name='items.0.product_id']");
  if(sel){
    const opt = [...sel.options].find(o=>/nasi/i.test(o.textContent)) || sel.options[1] || sel.options[0];
    await choose(sel, opt.value); A();
  }
  const qtyInput = doc().querySelector("input[name='items.0.qty']");
  if(qtyInput){
    await type(qtyInput, "35", 90); A();
  }
  await sleep(900);

  // BAB 5. Langkah 2: Cek Ketersediaan Tanggal Real-time (Beban Dapur)
  await say("Langkah kedua: kalender ketersediaan langsung menghitung beban oven dan tenaga kerja dapur secara real-time.", 5000); A();
  
  // Scroll agar pemilih tanggal terlihat penuh
  const step2Heading = byText("h3, h2, div", "Pilih Tanggal Acara") || doc().querySelector("[role=radiogroup]");
  if(step2Heading) await inView(step2Heading);

  // Tunggu hingga tombol tanggal selesai dimuat dari backend (bukan lagi skeleton)
  const radios = await waitFor(()=>{
    const all = [...doc().querySelectorAll("button[role=radio]")];
    if(!all.length) return null;
    const active = all.filter(b=>!b.disabled);
    return active.length ? active : all;
  }, 35000); A();

  let activeRadios = radios.filter(b=>!b.disabled);
  // Bila jendela 14 hari pertama penuh, klik tombol Berikutnya
  if(!activeRadios.length){
    const nextBtn = byText("button", "Berikutnya") || doc().querySelector("button[aria-label*='berikutnya']");
    if(nextBtn){
      await click(nextBtn); A();
      await sleep(1400);
      activeRadios = await waitFor(()=>{
        const all = [...doc().querySelectorAll("button[role=radio]")];
        const act = all.filter(b=>!b.disabled);
        return act.length ? act : (all.length?all:null);
      }, 20000); A();
    }
  }

  // Pilih tanggal hijau yang tersedia (misal tanggal ke-2 atau ke-3 yang aktif)
  const targetRadio = (activeRadios && activeRadios.length) ? activeRadios[Math.min(2, activeRadios.length - 1)] : radios[0];
  await click(targetRadio); A();
  await sleep(1100);

  // BAB 6. Langkah 3 & 4: Data Pemesan & Catatan Acara
  await say("Data pemesan otomatis terisi, dan Dewi menambahkan catatan jam pengantaran untuk kantor.", 4500); A();
  const notes = doc().querySelector("#notes");
  if(notes){
    await inView(notes);
    await type(notes, "Kirim jam 11 siang untuk makan siang rapat kantor.", 45); A();
  }
  await sleep(800);

  // BAB 7. Kirim Pesanan & Evaluasi 4-Gate Otomatis
  await say("Satu klik, dan pesanan langsung diuji kelayakannya oleh 4-Gate Decision Engine.", 4000); A();
  const submitBtn = [...doc().querySelectorAll("button[type=submit]")].find(b=>/Kirim Pesanan/.test(b.textContent)) || doc().querySelector("button[type=submit]");
  if(submitBtn){
    await click(submitBtn); A();
  }

  // Tunggu layar ringkasan hasil evaluasi pesanan
  await waitFor(()=>byText("button, a, h2, h3", "Buat Pesanan Lain") || byText("div, p, span", "Kode Pesanan Anda") || byText("button, a", "Lacak"), 45000); A();
  await sleep(800);
  doc().documentElement.scrollTo({top:0,behavior:"smooth"}); await sleep(1200);

  await say("Pesanan berhasil dikonfirmasi! Dewi mendapatkan kode tiket dan rincian DP transparan tanpa tebak-tebakan.", 5500); A();
  win().scrollTo({top: 380, behavior:"smooth"});
  await sleep(3500); A();
  hush();

  // BAB 8. Selesai & Penutup
  await closePopup(); A();
  await say("Tanpa chat bolak-balik via WhatsApp, Dewi mendapatkan kepastian dalam hitungan detik. Inilah kemudahan Kalkurasa!", 6000); A();
  hush();
  $("#lower").classList.remove("show");
}

/* ============ KONTROL ============ */
async function start(){
  if(location.protocol==="file:"){
    alert("Buka lewat https://kalkurasa-rouge.vercel.app/demo/index.html (atau localhost). File lokal (file://) tidak bisa memuat & mengontrol website.");
    return;
  }
  run++; const id=run;
  $("#title").classList.add("hide");
  hideAll();

  // Pemanasan Web Speech API saat user gesture
  speakVoice(" ");

  const c=$("#count"); c.style.display="grid";
  for(const n of [3,2,1]){ c.textContent=n; await sleep(900); if(id!==run) return; }
  c.style.display="none";
  try{
    await scenario(id);
  }catch(e){
    if(e.message!=="cancel"){
      console.error(e);
      say("Terhenti: "+e.message+" (cek koneksi & server)", 0);
    }
  }
}

function hideAll(){
  popup.classList.remove("open");
  cursor.style.opacity=0;
  $("#lower").classList.remove("show");
  $("#scene").classList.remove("dim");
  hush();
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  frame.removeAttribute("src");
}

$("#startBtn").onclick=start;

// Toggle Audio VO
$("#audioBtn").onclick = ()=>{
  audioVoiceActive = !audioVoiceActive;
  $("#audioBtn").textContent = audioVoiceActive ? "🔊 Audio VO: Aktif (V)" : "🔇 Audio VO: Bisu (V)";
  $("#audioBtn").classList.toggle("on", audioVoiceActive);
  if(!audioVoiceActive && 'speechSynthesis' in window) window.speechSynthesis.cancel();
};

// Toggle Subtitle
$("#subBtn").onclick = ()=>{
  subtitleActive = !subtitleActive;
  $("#subBtn").textContent = subtitleActive ? "💬 Subtitle (H)" : "🚫 Subtitle Mati (H)";
  $("#subBtn").classList.toggle("on", subtitleActive);
  document.body.classList.toggle("novo", !subtitleActive);
};

$("#restartBtn").onclick = ()=>{
  run++; hideAll(); $("#title").classList.remove("hide");
};

addEventListener("keydown",(e)=>{
  if(e.key===" "||e.key==="Enter"){
    if(!$("#title").classList.contains("hide")){
      e.preventDefault(); start();
    }
  }
  if(e.key.toLowerCase()==="v"){
    $("#audioBtn").click();
  }
  if(e.key.toLowerCase()==="h"){
    $("#subBtn").click();
  }
  if(e.key.toLowerCase()==="r"){
    $("#restartBtn").click();
  }
});
</script>
